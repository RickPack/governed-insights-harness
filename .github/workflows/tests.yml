name: tests

# Runs the offline suite. It needs no network and no API key, and none is provided here:
# the workflow has no secrets and read-only repository access.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-24.04  # pinned so the ubuntu-latest migration cannot change the environment
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest tests -q
